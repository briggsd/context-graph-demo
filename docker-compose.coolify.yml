# Coolify deployment compose for Software Engineering Context Graph.
#
# All routing is handled via Coolify "magic" env vars (SERVICE_FQDN_*).
# You only need to fill in the Environment Variables tab in Coolify — no
# Domains-tab clicking required.

services:
  neo4j:
    image: neo4j:5.26.0
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_server_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # No SERVICE_FQDN_NEO4J → stays internal

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    environment:
      # Magic env: Coolify auto-generates a domain for port 8000 on first deploy.
      # Override in the Coolify UI Env Vars tab to set your own domain.
      - SERVICE_FQDN_BACKEND_8000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MEMORY_EMBEDDING=sentence-transformers/all-MiniLM-L6-v2
      - CORS_ORIGINS=${SERVICE_FQDN_FRONTEND_3000}
    depends_on:
      neo4j: { condition: service_healthy }
    restart: unless-stopped

  mcp-server:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    command: ["uv", "run", "python", "mcp_server.py"]
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      MEMORY_EMBEDDING: sentence-transformers/all-MiniLM-L6-v2
      MCP_TRANSPORT: sse
      MCP_HOST: 0.0.0.0
      MCP_PORT: "9090"
    depends_on:
      neo4j: { condition: service_healthy }
    restart: unless-stopped
    # No SERVICE_FQDN_MCP_SERVER → stays internal, only reachable via mcp-proxy

  mcpproxy:
    build:
      context: ./mcp-proxy
    environment:
      - SERVICE_FQDN_MCPPROXY_9091
      - MCP_UPSTREAM=http://mcp-server:9090
      - MCP_AUTH_TOKENS=${MCP_AUTH_TOKENS}
    depends_on:
      - mcp-server
    restart: unless-stopped
    labels:
      # Tighten Traefik's flush interval for SSE so events stream without buffering.
      # The X-Accel-Buffering response header is also set inside mcp-proxy/main.py.
      - "traefik.http.services.mcpproxy.loadbalancer.responseForwarding.flushInterval=10ms"

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
      args:
        # Baked at build time. ${SERVICE_FQDN_BACKEND_8000} resolves to the
        # Coolify-assigned URL (e.g. https://backend-abc123.example.com).
        NEXT_PUBLIC_API_URL: ${SERVICE_FQDN_BACKEND_8000}/api
    environment:
      - SERVICE_FQDN_FRONTEND_3000
    depends_on: [backend]
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
