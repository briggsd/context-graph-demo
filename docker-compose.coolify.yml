# Coolify deployment — Raw Compose Mode
#
# Raw compose mode is enabled via Coolify's DB so this file is deployed
# verbatim without Coolify's parser mutations (which corrupt SERVICE_FQDN_*
# vars into mixed int/string PHP arrays that crash `docker compose build`).
#
# Routing is handled via explicit Traefik labels. Domains come from
# Coolify's env var store and are injected via the .env file at deploy time:
#
#   SERVICE_FQDN_BACKEND   = backend-<uuid>.apps.circlebackhq.com
#   SERVICE_FQDN_FRONTEND  = frontend-<uuid>.apps.circlebackhq.com
#   SERVICE_FQDN_MCPPROXY  = mcpproxy-<uuid>.apps.circlebackhq.com
#
# Public services attach to the `coolify` external network so Traefik
# can reach them. Internal services stay on the default compose network.
#
# Required secrets (set in Coolify Environment Variables tab):
#   ANTHROPIC_API_KEY, NEO4J_PASSWORD, MCP_AUTH_TOKENS
#   WEB_AUTH_USERS  — htpasswd-format user list for the web UI and API
#                     Generate: htpasswd -nb user password
#                     or: python3 -c "import hashlib,base64; print('user:{SHA}'+base64.b64encode(hashlib.sha1(b'pass').digest()).decode())"
#                     Escape $ as $$ in the value stored in Coolify.

services:

  # ── Internal ─────────────────────────────────────────────────────────────

  neo4j:
    image: neo4j:5.26.0
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_server_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - default

  mcp-server:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    command: ["uv", "run", "python", "mcp_server.py"]
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      MEMORY_EMBEDDING: sentence-transformers/all-MiniLM-L6-v2
      MCP_TRANSPORT: sse
      MCP_HOST: 0.0.0.0
      MCP_PORT: "9090"
    depends_on:
      neo4j: { condition: service_healthy }
    restart: unless-stopped
    networks:
      - default

  # ── Public (Traefik-routed) ───────────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    # WEB_AUTH_USERS is shared by backend + frontend so both need the same creds.
    # The frontend's browser fetches /api/* so both must accept the same header.
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      MEMORY_EMBEDDING: sentence-transformers/all-MiniLM-L6-v2
      CORS_ORIGINS: https://${SERVICE_FQDN_FRONTEND}
    depends_on:
      neo4j: { condition: service_healthy }
    restart: unless-stopped
    networks:
      - default
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      # HTTP → redirect to HTTPS
      - "traefik.http.routers.cg-backend-http.entrypoints=http"
      - "traefik.http.routers.cg-backend-http.rule=Host(`${SERVICE_FQDN_BACKEND}`)"
      - "traefik.http.routers.cg-backend-http.middlewares=redirect-to-https"
      # HTTPS + BasicAuth
      - "traefik.http.middlewares.cg-web-auth.basicauth.users=${WEB_AUTH_USERS}"
      - "traefik.http.middlewares.cg-web-auth.basicauth.removeheader=true"
      - "traefik.http.routers.cg-backend-https.entrypoints=https"
      - "traefik.http.routers.cg-backend-https.rule=Host(`${SERVICE_FQDN_BACKEND}`)"
      - "traefik.http.routers.cg-backend-https.tls=true"
      - "traefik.http.routers.cg-backend-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.cg-backend-https.middlewares=gzip,cg-web-auth"
      - "traefik.http.services.cg-backend.loadbalancer.server.port=8000"
      - "traefik.http.routers.cg-backend-http.service=cg-backend"
      - "traefik.http.routers.cg-backend-https.service=cg-backend"

  mcpproxy:
    build:
      context: ./mcp-proxy
    expose:
      - "9091"
    environment:
      MCP_UPSTREAM: http://mcp-server:9090
      MCP_AUTH_TOKENS: ${MCP_AUTH_TOKENS}
    depends_on:
      - mcp-server
    restart: unless-stopped
    networks:
      - default
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      # HTTP → redirect to HTTPS
      - "traefik.http.routers.cg-mcpproxy-http.entrypoints=http"
      - "traefik.http.routers.cg-mcpproxy-http.rule=Host(`${SERVICE_FQDN_MCPPROXY}`)"
      - "traefik.http.routers.cg-mcpproxy-http.middlewares=redirect-to-https"
      # HTTPS with SSE-friendly settings
      - "traefik.http.routers.cg-mcpproxy-https.entrypoints=https"
      - "traefik.http.routers.cg-mcpproxy-https.rule=Host(`${SERVICE_FQDN_MCPPROXY}`)"
      - "traefik.http.routers.cg-mcpproxy-https.tls=true"
      - "traefik.http.routers.cg-mcpproxy-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.cg-mcpproxy.loadbalancer.server.port=9091"
      - "traefik.http.services.cg-mcpproxy.loadbalancer.responseForwarding.flushInterval=10ms"
      - "traefik.http.routers.cg-mcpproxy-http.service=cg-mcpproxy"
      - "traefik.http.routers.cg-mcpproxy-https.service=cg-mcpproxy"

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
      args:
        # SERVICE_URL_BACKEND includes the https:// scheme (SERVICE_FQDN_BACKEND does not)
        NEXT_PUBLIC_API_URL: ${SERVICE_URL_BACKEND}/api
    environment:
      PORT: "3000"
    depends_on: [backend]
    restart: unless-stopped
    networks:
      - default
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      # HTTP → redirect to HTTPS
      - "traefik.http.routers.cg-frontend-http.entrypoints=http"
      - "traefik.http.routers.cg-frontend-http.rule=Host(`${SERVICE_FQDN_FRONTEND}`)"
      - "traefik.http.routers.cg-frontend-http.middlewares=redirect-to-https"
      # HTTPS + BasicAuth (same middleware, defined once on backend)
      - "traefik.http.routers.cg-frontend-https.entrypoints=https"
      - "traefik.http.routers.cg-frontend-https.rule=Host(`${SERVICE_FQDN_FRONTEND}`)"
      - "traefik.http.routers.cg-frontend-https.tls=true"
      - "traefik.http.routers.cg-frontend-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.cg-frontend-https.middlewares=gzip,cg-web-auth"
      - "traefik.http.services.cg-frontend.loadbalancer.server.port=3000"
      - "traefik.http.routers.cg-frontend-http.service=cg-frontend"
      - "traefik.http.routers.cg-frontend-https.service=cg-frontend"

volumes:
  neo4j_data:
  neo4j_logs:

networks:
  default:
    driver: bridge
  coolify:
    external: true   # Traefik lives here — public services join this network
