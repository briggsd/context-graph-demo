# Coolify deployment compose for Software Engineering Context Graph.
#
# Required environment variables (set in Coolify UI as secrets):
#   ANTHROPIC_API_KEY     — Anthropic key for the agent
#   NEO4J_PASSWORD        — strong password for Neo4j
#   MCP_AUTH_TOKENS       — comma-separated bearer tokens for MCP proxy
#   FRONTEND_DOMAIN       — e.g. cg.example.com  (used in CORS)
#   BACKEND_DOMAIN        — e.g. cg-api.example.com (baked into Next.js build)
#
# Coolify assigns Traefik domains per service via its UI:
#   frontend     → FRONTEND_DOMAIN     port 3000
#   backend      → BACKEND_DOMAIN      port 8000
#   mcp-proxy    → MCP_DOMAIN          port 9091  (the ONLY MCP entry exposed)
#   neo4j        → keep internal (no public domain)
#   mcp-server   → keep internal (no public domain)

services:
  neo4j:
    image: neo4j:5.26.0
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_server_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      MEMORY_EMBEDDING: sentence-transformers/all-MiniLM-L6-v2
      CORS_ORIGINS: https://${FRONTEND_DOMAIN}
    depends_on:
      neo4j: { condition: service_healthy }
    restart: unless-stopped

  mcp-server:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    command: ["uv", "run", "python", "mcp_server.py"]
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      MEMORY_EMBEDDING: sentence-transformers/all-MiniLM-L6-v2
      MCP_TRANSPORT: sse
      MCP_HOST: 0.0.0.0
      MCP_PORT: "9090"
    depends_on:
      neo4j: { condition: service_healthy }
    restart: unless-stopped
    # No public domain: only reachable from inside the compose network

  mcp-proxy:
    build:
      context: ./mcp-proxy
    environment:
      MCP_UPSTREAM: http://mcp-server:9090
      MCP_AUTH_TOKENS: ${MCP_AUTH_TOKENS}
    depends_on:
      - mcp-server
    restart: unless-stopped
    # SSE-friendly Traefik config (add via Coolify "Container Labels"):
    #   traefik.http.middlewares.mcp-sse.headers.customResponseHeaders.X-Accel-Buffering=no
    #   traefik.http.routers.mcp-proxy.middlewares=mcp-sse
    #   traefik.http.services.mcp-proxy.loadbalancer.responseForwarding.flushInterval=10ms

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: https://${BACKEND_DOMAIN}/api
    depends_on: [backend]
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
