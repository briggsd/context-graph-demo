# Coolify deployment compose for Software Engineering Context Graph.
#
# All routing is handled via Coolify "magic" env vars (SERVICE_FQDN_*).
# Set the values you want for the three SERVICE_FQDN_* vars in the
# Coolify Environment Variables tab — or leave them blank for auto-domains.
#
# ⚠️ COOLIFY PARSER WORKAROUND
#
# Coolify's parseDockerComposeFile() has a bug where the bare list-style entry
# `- SERVICE_FQDN_X_PORT` (with no =value) survives at integer key 0 in the
# resulting PHP array while sibling auto-injected entries become string-keyed.
# Symfony Yaml dumps that mixed array as malformed YAML, and the subsequent
# `docker compose build` fails with:
#
#     non-string key in services.<service>.environment: 0
#
# The bug only triggers when a SERVICE_FQDN_* var is declared in the
# environment of the SAME service it routes to (e.g. SERVICE_FQDN_FRONTEND_3000
# inside frontend's environment).
#
# WORKAROUND: declare ALL SERVICE_FQDN_* magic vars in the *backend* service's
# environment using map-style syntax. Coolify routes the resulting domains
# by name (FRONTEND_3000 → frontend:3000, MCPPROXY_9091 → mcpproxy:9091,
# etc.) regardless of which service declared the variable, so this is safe.

services:
  neo4j:
    image: neo4j:5.26.0
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_server_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    environment:
      # All three magic-env declarations live here (workaround — see header).
      # Empty string = auto-generate; set explicit https://... to use your domain.
      SERVICE_FQDN_BACKEND_8000: ""
      SERVICE_FQDN_FRONTEND_3000: ""
      SERVICE_FQDN_MCPPROXY_9091: ""
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      MEMORY_EMBEDDING: sentence-transformers/all-MiniLM-L6-v2
      CORS_ORIGINS: ${SERVICE_FQDN_FRONTEND_3000}
    depends_on:
      neo4j: { condition: service_healthy }
    restart: unless-stopped

  mcp-server:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    command: ["uv", "run", "python", "mcp_server.py"]
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      MEMORY_EMBEDDING: sentence-transformers/all-MiniLM-L6-v2
      MCP_TRANSPORT: sse
      MCP_HOST: 0.0.0.0
      MCP_PORT: "9090"
    depends_on:
      neo4j: { condition: service_healthy }
    restart: unless-stopped

  mcpproxy:
    build:
      context: ./mcp-proxy
    expose:
      - "9091"
    environment:
      MCP_UPSTREAM: http://mcp-server:9090
      MCP_AUTH_TOKENS: ${MCP_AUTH_TOKENS}
    depends_on:
      - mcp-server
    restart: unless-stopped
    labels:
      - "traefik.http.services.mcpproxy.loadbalancer.responseForwarding.flushInterval=10ms"

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${SERVICE_FQDN_BACKEND_8000}/api
    environment:
      PORT: "3000"
    depends_on: [backend]
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
