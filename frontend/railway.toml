$schema = "https://railway.com/railway.schema.json"

[build]
builder = "DOCKERFILE"
dockerfilePath = "../Dockerfile.frontend"

# NEXT_PUBLIC_API_URL must be set as an environment variable before the
# frontend is built. Set it in the Railway dashboard to:
#   https://${{backend.RAILWAY_PUBLIC_DOMAIN}}/api
# Railway resolves reference variables before the build starts.

[deploy]
restartPolicyType = "ON_FAILURE"
